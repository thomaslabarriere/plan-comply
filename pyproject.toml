[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plan-comply"
version = "0.1.0"
description = "End-to-end automation of construction compliance-rule checking, with a false-negative reliability instrument."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "openai>=1.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
plan-comply = "plancomply.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plancomply"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/plancomply"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
